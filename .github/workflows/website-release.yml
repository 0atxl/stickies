name: Update website release

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the current website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/website-release.json"
      - name: Update release links and version labels
        run: python3 scripts/update-website-release.py --release-json "$RUNNER_TEMP/website-release.json"
      - name: Push website update for Vercel
        run: |
          if git diff --quiet -- website/index.html; then
            echo 'Website release links are already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- website/index.html
          git commit -m "Update website release links"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo 'Updated website/index.html and pushed to the default branch for Vercel.' >> "$GITHUB_STEP_SUMMARY"
