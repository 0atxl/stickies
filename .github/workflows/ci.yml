name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            cargo_args: ""
          - variant: mcp
            cargo_args: "--features mcp"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils libadwaita-1-dev libfontconfig-dev libglib2.0-dev-bin libgtk-4-dev libgtk4-layer-shell-dev libsqlite3-dev pkg-config

      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate desktop entry
        run: desktop-file-validate data/dev.stickies.Stickies.desktop

      - name: Compile all targets
        run: cargo check --locked --all-targets ${{ matrix.cargo_args }}

      - name: Run Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.cargo_args }} -- -D warnings -A deprecated

      - name: Run tests
        run: cargo test --locked ${{ matrix.cargo_args }}

      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.cargo_args }}
