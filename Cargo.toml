[package]
name = "stickies"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
pango = { version = "0.22", features = ["v1_56"] }
pangocairo = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = "0.8"
glib-unix = "0.22"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
